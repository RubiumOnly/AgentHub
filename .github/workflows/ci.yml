name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Build (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Unit & Integration Tests
        run: mvn clean test
        working-directory: agenthub-backend

      - name: Output Test Failure Diagnostics
        if: failure()
        run: |
          for f in $(find target/surefire-reports -name "*.txt" 2>/dev/null); do
            if grep -E "FAILURE|ERROR" "$f" >/dev/null 2>&1; then
              echo "=== Failure Report: $f ==="
              cat "$f"
            fi
          done
        working-directory: agenthub-backend

  frontend-build:
    name: Frontend Build & Typecheck (Next.js 14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: agenthub-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --prefer-offline --no-audit
        working-directory: agenthub-frontend

      - name: Build Next.js Dashboard
        run: npm run build
        working-directory: agenthub-frontend
