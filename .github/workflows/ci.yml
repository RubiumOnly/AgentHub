name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests, MySQL 8 Migration & Concurrency Gate (Java 17)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_ci_password_2026
          MYSQL_DATABASE: agenthub
          MYSQL_USER: agenthub
          MYSQL_PASSWORD: agenthub_ci_password_2026
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_password_2026"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Unit & Integration Tests (Full Suite)
        run: mvn clean test
        working-directory: agenthub-backend

      - name: Run Real MySQL 8.0 Empty-DB Flyway Migration (V1-V12) & Core Integration Gate
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/agenthub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root_ci_password_2026
          SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
        # AOCI official cognition assets (aoci.txt / .aoci) are committed and enforced unconditionally
        # by Phase9BaselineAndGovernanceGuardTest; entry authoring progress is tracked by official aoci verify/check.
        run: |
          mvn test -Duser.timezone=UTC -Dtest="FlywayMigrationAndSchemaTest,ArchUnitArchitectureTest,Phase9BaselineAndGovernanceGuardTest,PersistentExecutionRecoveryAndLeaseTest,ConversationMonotonicSequenceAndConcurrencyTest,PhaseEProductionOpsAndDisasterRecoveryIntegrationTest,PhaseFProductQualityAndEvidenceBundleIntegrationTest,FullLifecycleEndToEndIntegrationTest"
        working-directory: agenthub-backend

      - name: Output Test Failure Diagnostics
        if: failure()
        run: |
          for f in $(find target/surefire-reports -name "*.txt" 2>/dev/null); do
            if grep -E "FAILURE|ERROR" "$f" >/dev/null 2>&1; then
              echo "=== Failure Report: $f ==="
              cat "$f"
            fi
          done
        working-directory: agenthub-backend

  frontend-build:
    name: Frontend Build, Typecheck & Lint Gate (Next.js 14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: agenthub-frontend/package-lock.json

      - name: Phase 0 Debt Freeze — Verify Zero Localhost, Legacy Workspace Routes & Silent Mock Fallback in Frontend
        run: |
          if grep -RIn -E "localhost|127\.0\.0\.1|/api/workspace/|d:/work/agenthub|\"user-1\"|'user-1'|isDemoMode\(\) \|\| !projectId|isDemoMode\(\) \|\| runId === MOCK_RUN\.id" src/; then
            echo "[FAIL] Hardcoded localhost, legacy /api/workspace/, user-1, host path, or non-demo Mock fallback found in agenthub-frontend/src"
            exit 1
          fi
        working-directory: agenthub-frontend

      - name: Install Frontend Dependencies
        run: npm ci --prefer-offline --no-audit
        working-directory: agenthub-frontend

      - name: TypeScript Strict Typecheck
        run: npx tsc --noEmit
        working-directory: agenthub-frontend

      - name: Build Next.js Production Standalone Bundle
        run: npm run build
        working-directory: agenthub-frontend

  production-ops-and-container-gate:
    name: Production Config, Compose, Prometheus, Docker Images & DR Drill Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Production Secret Rules & Pre-Deploy Gate Script
        run: |
          set -euo pipefail
          echo "=== 1. Verifying .env.production.example rejects deployment ==="
          if bash ./scripts/deploy-prod.sh --env-file .env.production.example --validate-only; then
            echo "[FAIL] .env.production.example with placeholder values must be rejected!"
            exit 1
          fi
          echo "[PASS] Placeholder .env.production.example was properly rejected."

          echo "=== 2. Generating strong .env.production.ci and validating ==="
          SHORT_SHA="${GITHUB_SHA::7}"
          printf '%s\n' \
            "IMAGE_TAG=${SHORT_SHA}" \
            "MYSQL_ROOT_PASSWORD=ProdRootDbSecret_998877665544_Strong!" \
            "MYSQL_DATABASE=agenthub" \
            "MYSQL_USER=agenthub_app" \
            "MYSQL_PASSWORD=ProdAppDbSecret_112233445566_Strong!" \
            "REDIS_PASSWORD=" \
            "AGENTHUB_AUTH_SECRET=8f9a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c" \
            "ACTUATOR_PROMETHEUS_TOKEN=PromObsToken_2026_SecureMetricsKey_998877" \
            "HTTP_PORT=80" \
            "HTTPS_PORT=443" \
            "DEEPSEEK_API_KEY=" \
            "OPENAI_API_KEY=" \
            "ANTHROPIC_API_KEY=" \
            "GEMINI_API_KEY=" \
            > .env.production.ci

          bash ./scripts/deploy-prod.sh --env-file .env.production.ci --validate-only
          docker compose --env-file .env.production.ci -f docker-compose.prod.yml config --quiet
          rm -f .env.production.ci

      - name: Validate Prometheus Scrape & Alert Rules via promtool
        run: |
          docker run --rm \
            -v "$PWD/docker/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus:v2.51.0 \
            check config /etc/prometheus/prometheus.yml

          docker run --rm \
            -v "$PWD/docker/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus:v2.51.0 \
            check rules /etc/prometheus/agenthub-alerts.yml

      - name: Build Immutable SHA-Tagged Production Images & Verify Non-Root Security
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          docker build -t "agenthub/agenthub-backend:${SHORT_SHA}" ./agenthub-backend
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=/api \
            --build-arg NEXT_PUBLIC_AGENTHUB_DEMO_MODE=false \
            -t "agenthub/agenthub-frontend:${SHORT_SHA}" \
            ./agenthub-frontend

          BACKEND_UID=$(docker run --rm --entrypoint id "agenthub/agenthub-backend:${SHORT_SHA}" -u)
          FRONTEND_UID=$(docker run --rm --entrypoint id "agenthub/agenthub-frontend:${SHORT_SHA}" -u)
          echo "Backend container UID=${BACKEND_UID}, Frontend container UID=${FRONTEND_UID}"
          if [ "${BACKEND_UID}" != "10001" ]; then
            echo "[FAIL] Backend container must run as UID 10001, got ${BACKEND_UID}"
            exit 1
          fi
          if [ "${FRONTEND_UID}" != "1001" ]; then
            echo "[FAIL] Frontend container must run as UID 1001, got ${FRONTEND_UID}"
            exit 1
          fi

      - name: Run Automated Backup, Encryption, Tamper Detection & Clean Restore Drill
        run: |
          set -euo pipefail
          DR_TMP=$(mktemp -d)
          mkdir -p "${DR_TMP}/workspaces/ws-drill-01/src" "${DR_TMP}/backups" "${DR_TMP}/restored"
          echo "console.log('agenthub-phase-e-drill');" > "${DR_TMP}/workspaces/ws-drill-01/src/index.js"

          export BACKUP_ENCRYPTION_KEY="CiDrillStrongPassphrase_2026!"
          bash ./scripts/backup-prod.sh \
            --backup-root "${DR_TMP}/backups" \
            --workspace-dir "${DR_TMP}/workspaces" \
            --retention-days 7

          LATEST_BKP=$(ls -1dt "${DR_TMP}/backups"/bkp-* | head -n 1)
          bash ./scripts/restore-prod.sh \
            --backup-dir "${LATEST_BKP}" \
            --verify-only

          bash ./scripts/restore-prod.sh \
            --backup-dir "${LATEST_BKP}" \
            --workspace-dir "${DR_TMP}/restored/workspaces"

          diff -u "${DR_TMP}/workspaces/ws-drill-01/src/index.js" "${DR_TMP}/restored/workspaces/ws-drill-01/src/index.js"

          echo "corrupted" >> "${LATEST_BKP}/workspaces.tar.gz"
          if bash ./scripts/restore-prod.sh --backup-dir "${LATEST_BKP}" --verify-only; then
            echo "[FAIL] Tampered backup must be rejected by restore-prod.sh!"
            exit 1
          fi
          echo "[PASS] Tampered backup was accurately detected and blocked."
          rm -rf "${DR_TMP}"
