global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "agenthub-production"
    env: "prod"

rule_files:
  - "agenthub-alerts.yml"

scrape_configs:
  - job_name: "agenthub-backend"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - "agenthub-backend:8080"
        labels:
          service: "agenthub-backend"
          tier: "core-kernel"
