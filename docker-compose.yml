version: '3.8'

services:
  agenthub-mysql:
    image: mysql:8.0
    container_name: agenthub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: agenthub
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  agenthub-redis:
    image: redis:7-alpine
    container_name: agenthub-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
