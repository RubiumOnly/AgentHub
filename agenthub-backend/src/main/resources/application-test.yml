spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:agenthub_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: validate
    show-sql: false
  h2:
    console:
      enabled: false

agenthub:
  auth:
    secret: "AgentHub-Test-Secret-Key-Phase1-2026-SuperStrong-Min32Chars"
    allow-superuser-bypass: true
  workspace:
    base-dir: "${AGENTHUB_TEST_WORKSPACE_DIR:./target/test-workspaces}"
  cli:
    timeout-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: WARN
    com.agenthub: INFO
    org.hibernate: WARN
    org.springframework: WARN
