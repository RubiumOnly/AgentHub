spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:agenthub_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  h2:
    console:
      enabled: false

agenthub:
  workspace:
    base-dir: "${AGENTHUB_TEST_WORKSPACE_DIR:./target/test-workspaces}"
  cli:
    timeout-ms: 10000

logging:
  level:
    root: WARN
    com.agenthub: INFO
    org.hibernate: WARN
    org.springframework: WARN
