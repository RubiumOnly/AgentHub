server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: agenthub-backend
  profiles:
    active: dev
  config:
    import:
      - "optional:classpath:application-local.yml"
      - "optional:file:.env[.properties]"
  datasource:
    url: jdbc:h2:mem:agenthub_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

agenthub:
  workspace:
    base-dir: "d:/work/agenthub/data/workspaces"
  cli:
    timeout-ms: 300000
  llm:
    deepseek:
      api-key: "${DEEPSEEK_API_KEY:}"
      base-url: "${DEEPSEEK_BASE_URL:https://api.deepseek.com}"
      model: "${DEEPSEEK_MODEL:deepseek-chat}"
