server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: agenthub-backend
  profiles:
    default: dev
    active: ${SPRING_PROFILES_ACTIVE:}
  config:
    import:
      - "optional:classpath:application-local.yml"
      - "optional:file:src/main/resources/application-local.yml"
      - "optional:file:.env[.properties]"
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

agenthub:
  workspace:
    base-dir: ${AGENTHUB_WORKSPACE_BASE_DIR:./data/workspaces}
  cli:
    timeout-ms: ${AGENTHUB_CLI_TIMEOUT_MS:300000}
  llm:
    deepseek:
      api-key: "${DEEPSEEK_API_KEY:}"
      base-url: "${DEEPSEEK_BASE_URL:https://api.deepseek.com}"
      model: "${DEEPSEEK_MODEL:deepseek-chat}"
