spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:agenthub_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

agenthub:
  workspace:
    base-dir: "${AGENTHUB_WORKSPACE_BASE_DIR:./data/workspaces}"

logging:
  level:
    root: INFO
    com.agenthub: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
